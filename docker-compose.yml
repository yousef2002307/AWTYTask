services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-awty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-awty_secret}
      POSTGRES_DB: ${POSTGRES_DB:-awty}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awty} -d ${POSTGRES_DB:-awty}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-awty}:${POSTGRES_PASSWORD:-awty_secret}@postgres:5432/${POSTGRES_DB:-awty}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-awty}:${POSTGRES_PASSWORD:-awty_secret}@postgres:5432/${POSTGRES_DB:-awty}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
